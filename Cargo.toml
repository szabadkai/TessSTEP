[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tessstep-schema = { path = "crates/tessstep-schema" }
tessstep-codegen = { path = "crates/tessstep-codegen" }
tessstep-express = { path = "crates/tessstep-express", version = "=0.1.0" }
tessstep-part21 = { path = "crates/tessstep-part21", version = "=0.1.0" }
tessstep-model = { path = "crates/tessstep-model", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true
