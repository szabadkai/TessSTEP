name: Extended validation
on:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * *'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run part21_parser corpus/part21/valid corpus/part21/invalid -- -max_total_time=120 -max_len=65536
      - run: cargo fuzz run part21_lexer corpus/part21/valid corpus/part21/invalid -- -max_total_time=120 -max_len=65536
      - run: cargo fuzz run entity_database corpus/part21/valid corpus/part21/invalid -- -max_total_time=120 -max_len=65536
      - run: cargo fuzz run express_frontend corpus/express/valid corpus/express/invalid -- -max_total_time=120 -max_len=8192
      - run: cargo fuzz run schema_codegen corpus/express/valid corpus/express/invalid -- -max_total_time=120 -max_len=8192
      - run: cargo fuzz run schema_decoder corpus/schema -- -max_total_time=120 -max_len=65536
      - run: cargo fuzz run math_primitives -- -max_total_time=120 -max_len=144
      - run: cargo fuzz run product_adapter corpus/product -- -max_total_time=120 -max_len=65536
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 7
  regression-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - run: cargo test --workspace --release --locked
      - name: Record benchmark output
        shell: bash
        run: cargo bench --workspace --locked 2>&1 | tee benchmarks.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: benchmark-results
          path: benchmarks.txt
          retention-days: 14
